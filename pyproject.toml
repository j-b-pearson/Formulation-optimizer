[project]
name = "formopt"
version = "0.1.0"
description = "Cost-aware Bayesian optimization that recommends the cheapest path to an in-spec formulation."
readme = "README.md"
authors = [
    { name = "j-b-pearson" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
    "xlrd>=2.0.2",
]

[project.scripts]
formopt = "formopt.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
llm = [
    "openai>=3.46.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Do not reformat code snippets inside Markdown docs (the pack docs are reference text).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Notebooks: allow short math names (X, K) and imports inside cells.
"notebooks/*.ipynb" = ["N803", "N806", "N816", "E402"]

[tool.ruff.lint.pep8-naming]
# X, Xs, K, U are standard matrix names in GP and design-of-experiments code.
ignore-names = ["X", "X*", "Xs", "K", "K*", "U", "U*", "Ks*", "L", "N", "X_*", "Y*", "*_X", "*_X*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
