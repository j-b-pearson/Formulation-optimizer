# Configuration for the cost-aware formulation optimizer.
# Every price, spec, budget, simulator coefficient and seed lives here, not in code.
# Values marked "illustrative" are plausible example values. Values marked "ASSUMPTION" were not
# verified from a free authoritative source. See docs/DOMAIN_PRIMER.md for the basis.

enamel:
  # SYNTHETIC magnet wire enamel simulator. Plausible in direction and order of magnitude,
  # not calibrated to any real enamel or any company's products.
  variables:
    pai_fraction: {low: 0.0, high: 1.0, unit: "fraction"}      # illustrative blend variable
    solids_pct: {low: 25.0, high: 45.0, unit: "mass %"}        # US 4,374,221 claims ~28-45 %
    catalyst_phr: {low: 0.0, high: 1.0, unit: "phr"}           # illustrative
    oven_temp_c: {low: 420.0, high: 580.0, unit: "deg C"}      # US 4,374,221 outlet ~427-593 C
    line_speed_m_min: {low: 10.0, high: 40.0, unit: "m/min"}   # illustrative (patent ~17 m/min)
  max_cure_temp_c: 560.0          # known constraint: equipment and safety limit (illustrative)
  specs:
    breakdown_kv: {lower: 30.0}                                  # proxy units, illustrative
    flex_pass: {lower: 0.8}                                      # fraction of 5 mandrel wraps
    viscosity_cp: {lower: 2000.0, upper: 15000.0, transform: log}  # window from US 4,374,221
  model:
    # Response model coefficients (docs/DOMAIN_PRIMER.md section 3). Frozen after calibration.
    A: 5.4e4               # Arrhenius pre-factor for the cure rate
    Ea_over_R: 9000.0      # activation energy over gas constant (K)
    c_cat: 1.5             # catalyst rate boost per phr
    L_ref: 60.0            # reference line speed for residence time (m/min)
    dose_max: 3.0          # cure dose above which the film is overcured
    s_base: 25.0           # solids (%) at which build = b0 and viscosity = v0
    b0: 0.6                # film build at s_base solids (relative units)
    b1: 0.02               # build gain per % solids
    k_bd: 40.0             # breakdown scale
    k_pai: 0.25            # breakdown gain from PAI fraction
    k_over: 6.0            # breakdown loss per unit overcure
    sd_bd: 1.0             # breakdown measurement noise sd
    f0: 3.0                # flexibility logit intercept
    f_over: 2.5            # flexibility logit loss per unit overcure
    f_sol: 1.5             # flexibility logit loss per f_sol_scale % solids above s_ref
    f_sol_scale: 7.0       # solids step (%) for f_sol
    s_ref: 38.0            # reference solids for flexibility (%)
    f_pai: 0.8             # flexibility logit gain from PAI fraction
    n_flex_specimens: 5    # mandrel-wrap specimens per test (binomial trials)
    v0: 800.0              # viscosity at s_base solids, no PAI, no catalyst (cP)
    v_sol: 0.09            # log-viscosity slope per % solids
    v_pai: 0.9             # log-viscosity gain from PAI fraction
    v_cat: 0.1             # log-viscosity gain per phr catalyst
    sd_logv: 0.03          # log-viscosity noise sd (about 3 %)
  prices:
    # $/kg, all illustrative. PAI is generally pricier than polyester-imide; real prices vary.
    pai_resin: 14.00       # solid basis
    pei_resin: 5.00        # solid basis
    solvent: 1.80
    catalyst: 40.00
  run_cost:
    fixed: 150.0           # $ per line trial: setup, technician time, testing (illustrative)
    batch_kg: 40.0         # kg of enamel consumed per trial (illustrative)
    energy_rate: 3.0       # $ per (deg C above base) per relative residence time (illustrative)
    energy_temp_base: 400.0
    energy_speed_ref: 30.0
  run_cost_spread:
    # Run-cost spread study only. null = the v1 run-cost formula above (the default; v1 reproduces).
    # A number s >= 1 rescales the v1 variable cost (batch material + oven energy/time) so the
    # most expensive possible run costs s times the cheapest, keeping the mean run cost over the
    # known-feasible box at its v1 value. Set per run with `benchmark --run-cost-spread S`.
    s: null
    mean_samples: 200000   # uniform known-feasible samples used for the v1 mean run cost
    mean_seed: 2026
  budget: 15000.0          # $ lab budget per campaign

concrete:
  age_days: 28                     # specification age; the emulator is trained on all ages
  # Unknown constraint. Calibrated: a 40 MPa target made 53.6 % of the
  # known-feasible region pass (rule: 5-35 %); 50 MPa gives 25.4 %.
  target_strength_mpa: 50.0
  prices_per_kg:
    cement: 0.160          # $160/t, USGS MCS 2026 Cement, 2025 average mill value
    slag: 0.140            # $140/t, USGS MCS 2026 Iron and Steel Slag ("about $140 or more" GGBFS)
    fly_ash: 0.040         # $40/t, ASSUMPTION (no free authoritative price verified)
    water: 0.001           # ASSUMPTION, negligible
    superplasticizer: 2.00 # ASSUMPTION, admixture prices vary widely
    coarse_agg: 0.0185     # $18.50/t, USGS MCS 2026 Stone (Crushed), 2025 average unit value
    fine_agg: 0.0145       # $14.50/t, USGS MCS 2026 Sand and Gravel (Construction), 2025
  run_cost:
    fixed: 250.0           # $ per trial batch: casting, curing, testing (illustrative)
    batch_m3: 0.05         # m3 of concrete per trial batch (illustrative)
  noise_sd: null           # null means: use the emulator's grouped-CV residual sd, capped below
  noise_sd_cap: 5.0        # MPa
  domain:
    k: 5                   # neighbours for the applicability-domain distance
    quantile: 0.95         # threshold quantile of training leave-one-out kNN distances
  emulator:
    candidates: [extra_trees, hist_gb]
    n_estimators: 500
    min_samples_leaf: 2
    cv_folds: 5
    seed: 0
  mix_id_round: 0.1        # kg/m3 rounding before hashing ingredients into mix_id
  budget: 7500.0           # $ lab budget per campaign

bo:
  n_init: 6                # LHS points before the first GP fit
  n_candidates: 4000       # known-feasible random candidates scored per step
  quick_n_candidates: 1000 # used with --quick
  gp_restarts: 2           # n_restarts_optimizer for the GP marginal likelihood
  gp_noise_bounds: [1.0e-6, 1.0]
  # Upper bound 10 (not 100): inputs are unit-scaled, so 10 is already nearly flat; 100 let the
  # GP declare variables irrelevant from ~25 points and made it overconfident (hold-out calibration check).
  gp_length_scale_bounds: [1.0e-2, 10.0]
  gp_constant_bounds: [1.0e-3, 1.0e3]

benchmark:
  methods: [random, lhs, factorial, bo_plain, bo_cost, bo_cost_cooled]
  seed_start: 0
  n_seeds: 30              # reporting seeds 0..29
  dev_seed_start: 1000
  n_dev_seeds: 10          # dev seeds 1000..1009, used only for settings decisions
  quick_seeds: 5
  target_tol: 0.05         # success = truly feasible within 5 % of the reference optimum
  grid_points: 100         # spend grid for regret traces
  n_boot: 2000
  bootstrap_seed: 0
  headline_cost_method: bo_cost_cooled   # chosen on dev seeds 1000-1009
  n_jobs: 1
  random_batch: 1000       # candidates drawn per random-search step
  factorial:
    enamel_generators: "a b c d abcd"          # 2^(5-1), resolution V
    concrete_generators: "a b c d abc bcd acd" # 2^(7-3), resolution IV
    levels: [0.2, 0.8]
    n_center: 3
  reference:
    n_samples: 200000
    seed: 12345
    polish_starts: 5
    polish_batch: 2000
    polish_radii: [0.05, 0.02, 0.01, 0.005, 0.002, 0.001]
    polish_max_moves: 30

price_shock:
  min_pof: 0.8             # recommend the cheapest candidate with at least this PoF
  n_candidates: 50000
  seed: 7
  enamel_changes: {pai_resin: 1.25, solvent: 1.40}
  concrete_changes: {cement: 1.30}

lab_note:
  # The lab-note risk label is computed in code from the probability of passing all specs.
  risk_thresholds:
    high_below: 0.5        # PoF < 0.5: High
    low_at_or_above: 0.8   # PoF >= 0.8: Low; 0.5 <= PoF < 0.8: Medium
  max_retries: 1           # LLM retries after an invalid note, then the template fallback

v2:
  # Pre-registered in docs/PREREGISTRATION_v2.md. Do not change after reporting-seed results
  # exist; log any change as a deviation in the README.
  reporting_seed_start: 31
  n_reporting_seeds: 100       # reporting seeds 31..130, all new
  fallback_n_reporting_seeds: 60   # 31..90, only if the runtime estimate exceeds the limit
  dev_seed_start: 1001
  n_dev_seeds: 10              # dev seeds 1001..1010: timing, debugging, batch mode only
  runtime_limit_hours: 6.0
  timing_n_jobs: 6
  spread_levels: [1, 3, 10]
  sweep_methods: [random, lhs, bo_plain, bo_cost, bo_cost_cooled]
  plain_method: bo_plain
  h1_headline_method: bo_cost_cooled   # v1's pre-chosen headline
  h1_secondary_method: bo_cost
  h2_method: bo_cost                   # headline for H2 only
  n_boot: 2000                 # percentile bootstrap, same as v1
  bootstrap_seed: 0
  robustness_n_boot: 10000     # pre-registered robustness re-check of every verdict
  robustness_seed: 1
  tolerances: [0.02, 0.05, 0.10, 0.15]   # concrete success-vs-tolerance curves
  batch:
    q: 4                       # batch mode (exploratory, dev seeds only)
    methods: [bo_plain, bo_cost_cooled]

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  reports_dir: reports/v1         # v1 outputs (moved here unchanged in v2)
  figures_dir: reports/v1/figures
  v2_dir: reports/v2              # every new v2 output
